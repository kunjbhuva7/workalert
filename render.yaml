services:
  - type: web
    name: workalert
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src
    autoDeploy: true
    healthCheckPath: /api/push/key
